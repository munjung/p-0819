<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>배주열 BIRTHDAY WOD</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Galmuri11:wght@400;700&display=swap');
  * { margin:0; padding:0; box-sizing:border-box;
    -webkit-touch-callout:none; -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color:transparent; }
  body {
    background:#0d0b12;
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; padding:12px;
    font-family:'Galmuri11', monospace; color:#f0ead8;
  }
  #wrap { width:100%; max-width:400px; }
  #hud { display:flex; justify-content:space-between; align-items:flex-end;
    margin-bottom:8px; font-size:12px; letter-spacing:0.5px; }
  #roundLabel { color:#ffd23f; }
  canvas { width:100%; display:block;
    border:3px solid #2e2a3d; border-radius:4px;
    image-rendering:pixelated; background:#14121c; touch-action:none; }
  #hint { margin-top:8px; font-size:10px; color:#7a7292; line-height:1.7; text-align:center; }
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">
    <div id="roundLabel">BIRTHDAY WOD</div>
    <div style="display:flex; gap:12px; align-items:flex-end">
      <div id="mute" style="cursor:pointer; color:#7a7292">♪ ON</div>
      <div id="scoreLabel">SCORE 0</div>
    </div>
  </div>
  <canvas id="c" width="540" height="960"></canvas>
  <div id="hint">게이지가 골드 존에 왔을 때 탭! · 미리 누르면 NO REP!</div>
</div>

<script>
const c = document.getElementById('c');
const x = c.getContext('2d');
x.imageSmoothingEnabled = false;

const W = 270, H = 480;
const FLOOR = 360;

// ---------- WOD 정의 ----------
// pw/gw: 퍼펙트/굿 존 반폭, random: 존 위치 랩마다 랜덤
const WOD = [
  // ponytail: 테스트용 랩 수 (정식: 8/6/8/16/6/10)
  { move:'snatch', label:'스내치',           weight:75,  wStep:10, reps:3,  dur:92, pw:0.045, gw:0.105, random:false },
  { move:'wb',     label:'월볼샷',            weight:20,  reps:3,  dur:72, pw:0.045, gw:0.100, random:false },
  { move:'bmu',    label:'바 머슬업',         weight:0,   reps:3,  dur:78, pw:0.040, gw:0.100, random:true  },
  { move:'du',     label:'더블언더',          weight:0,   reps:3,  dur:34, pw:0.050, gw:0.110, random:false },
  { move:'cj',     label:'클린&저크',         weight:115, wStep:10, reps:3,  dur:70, pw:0.038, gw:0.095, random:true  },
  { move:'alt',    label:'스내치 155lb + 머슬업', weight:155, reps:3,  dur:62, pw:0.032, gw:0.085, random:true  },
];

let state = 'title';   // title | intro | play | done
let roundIdx = 0, repIdx = 0;
let phase = 'ready';   // ready | run | result
let frame = 0;
let curMove = 'snatch';
let cjStage = 0;       // 클린&저크: 0=클린 탭, 1=저크 탭
let repDur = 90;
let zone = {pLo:0.8, pHi:0.89, gLo:0.72, gHi:0.93};
let judgment = null;
let combo = 0, maxCombo = 0, score = 0;
let perfects = 0, goods = 0, misses = 0, tonnage = 0;
let t = 0, shake = 0;
let particles = [];
let popups = [];

// ---------- 사운드 ----------
let AC = null, muted = false;
function audioInit(){
  if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(_){ return; } }
  if(AC.state==='suspended') AC.resume();
}
function beep(freq, dur, type='square', vol=0.12, slide=0){
  if(!AC || muted) return;
  const o=AC.createOscillator(), g=AC.createGain();
  o.type=type;
  o.frequency.setValueAtTime(freq, AC.currentTime);
  if(slide) o.frequency.linearRampToValueAtTime(Math.max(40,freq+slide), AC.currentTime+dur);
  g.gain.setValueAtTime(vol, AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime+dur);
  o.connect(g); g.connect(AC.destination);
  o.start(); o.stop(AC.currentTime+dur);
}
const sfx = {
  count(){ beep(440, 0.1, 'square', 0.1); },
  go(){ beep(880, 0.22, 'square', 0.12); },
  perfect(){ [784,988,1319].forEach((f,i)=>setTimeout(()=>beep(f,0.1,'square',0.11), i*55)); },
  good(){ beep(660, 0.1, 'square', 0.1); },
  norep(){ beep(150, 0.3, 'sawtooth', 0.15, -80); },
  du(){ beep(990, 0.05, 'square', 0.09); },
  clear(){ [523,659,784,1047,1319].forEach((f,i)=>setTimeout(()=>beep(f,0.15,'square',0.1), i*120)); },
};
const muteEl = document.getElementById('mute');
function toggleMute(){ muted=!muted; muteEl.textContent = muted?'♪ OFF':'♪ ON'; }
muteEl.addEventListener('pointerdown', e=>{ e.preventDefault(); audioInit(); toggleMute(); });

// ---------- 입력 ----------
function action(){
  audioInit();
  if(state==='title'){ startWOD(); return; }
  if(state==='done'){ if(t>60){ state='title'; t=0; updateHUD(); } return; }
  if(state==='play'){
    if(phase==='run') judge(frame / repDur);
    else if(phase==='ready') judge(0);   // 부정출발도 NO REP
  }
}
addEventListener('keydown', e=>{
  if(e.code==='Space'||e.code==='ArrowUp'){ e.preventDefault(); if(!e.repeat) action(); }
  if(e.code==='KeyM'){ audioInit(); toggleMute(); }
});
c.addEventListener('pointerdown', e=>{ e.preventDefault(); action(); });
['contextmenu','selectstart','dragstart'].forEach(ev=>document.addEventListener(ev, e=>e.preventDefault()));
document.addEventListener('gesturestart', e=>e.preventDefault());

// ---------- 진행 ----------
function curWeight(){    // 랩마다 점진적 증량 (wStep)
  const r = WOD[roundIdx];
  return r.weight ? r.weight + (r.wStep||0)*repIdx : 0;
}
function readyDur(){ return curMove==='du' ? 10 : (curMove==='wb' ? 24 : 32); }
function resultDur(){
  const ok = judgment && judgment.pts>0;
  if(curMove==='du') return ok ? 12 : 30;
  if(curMove==='wb') return ok ? 26 : 32;
  if(curMove==='bmu') return ok ? 74 : 42;   // 할로우~서포트 풀 시퀀스
  return ok ? 56 : 42;
}
function pickMove(){
  const m = WOD[roundIdx].move;
  curMove = (m==='alt') ? (repIdx%2===0 ? 'snatch' : 'bmu') : m;
}
function startWOD(){
  state='intro'; roundIdx=0; repIdx=0; frame=0; t=0;
  combo=0; maxCombo=0; score=0; perfects=0; goods=0; misses=0; tonnage=0;
  particles=[]; popups=[];
  updateHUD();
}
function setZone(){
  const r = WOD[roundIdx];
  // 존 위치: random 라운드는 랩마다 이동 (타이밍 암기 방지)
  const zc = r.random ? 0.55 + Math.random()*0.3 : 0.845;
  zone = { pLo:zc-r.pw, pHi:zc+r.pw, gLo:zc-r.gw, gHi:zc+r.gw };
}
function startRep(){
  phase='ready'; frame=0; judgment=null; cjStage=0; pickMove();
  // 속도: 랩 진행 + 랜덤 편차
  repDur = Math.max(28, WOD[roundIdx].dur - repIdx*1.5 + (Math.random()*10-5));
  setZone();
}
function judge(p){
  let res;
  if(p>=zone.pLo && p<=zone.pHi){
    combo++; perfects++;
    const pts = 100 + combo*10;
    score += pts;
    res = {text:'PERFECT!', col:'#ffd23f', pts};
    if(curMove==='du') sfx.du(); else sfx.perfect();
    shake=5; chalk(20);
  } else if(p>=zone.gLo && p<=zone.gHi){
    combo++; goods++;
    const pts = 50 + combo*5;
    score += pts;
    res = {text:'GOOD', col:'#8be0d8', pts};
    sfx.good(); chalk(8);
  } else {
    combo=0; misses++;
    res = {text:p<zone.gLo?'EARLY!':'NO REP!', col:'#ff5a5a', pts:0};
    sfx.norep(); shake=7;
  }
  if(res.pts && (curMove==='snatch' || curMove==='wb' || (curMove==='cj' && cjStage===1)))
    tonnage += curWeight();
  maxCombo = Math.max(maxCombo, combo);
  judgment = res;
  popups.push({text:res.text, col:res.col, y:150, life:40});
  if(res.pts) popups.push({text:'+'+res.pts, col:'#f0ead8', y:172, life:40});
  if(curMove==='cj' && cjStage===0 && res.pts){
    cjStage=1; phase='mid'; frame=0;   // 클린 성공 → 랙 → 저크 게이지로 전환
  } else {
    phase='result'; frame=0;
  }
  updateHUD();
}
function nextRep(){
  repIdx++;
  if(repIdx >= WOD[roundIdx].reps){
    roundIdx++;
    repIdx=0;
    if(roundIdx >= WOD.length){ state='done'; t=0; sfx.clear(); return; }
    state='intro'; frame=0;
    updateHUD();
  } else { startRep(); updateHUD(); }
}
function updateHUD(){
  const r = WOD[roundIdx];
  document.getElementById('roundLabel').textContent =
    (state==='play'||state==='intro')
      ? `R${roundIdx+1}/${WOD.length} ${r.label} ${repIdx+1}/${r.reps}`
      : 'BIRTHDAY WOD';
  document.getElementById('scoreLabel').textContent = 'SCORE '+score;
}
function chalk(n){
  for(let i=0;i<n;i++) particles.push({
    x:135+Math.random()*30-15, y:FLOOR-110-Math.random()*40,
    vx:(Math.random()-.5)*3, vy:-Math.random()*2.5,
    life:20+Math.random()*20, col:'#ffffffcc'
  });
}

// ---------- 픽셀 헬퍼 ----------
function px(a,b,w,h,col){ x.fillStyle=col; x.fillRect(a|0,b|0,w,h); }
function text(str,cx,cy,size,col,align='center'){
  x.font=size+'px Galmuri11, monospace'; x.textAlign=align; x.fillStyle=col; x.fillText(str,cx,cy);
}

// ---------- 배경: 크로스핏 박스 (흰 천장 + OSB 합판 + 파랑 리그) ----------
function drawGym(){
  // 천장: 흰 판넬 + 형광등
  px(0,0,W,46,'#e8e6e0');
  px(0,20,W,2,'#c8c5bc');                    // 천장 보
  for(let i=0;i<3;i++){ px(18+i*90,6,54,5,'#fbfbf5'); px(18+i*90,11,54,1,'#b8b5ac'); }
  px(0,44,W,2,'#b8b5ac');
  // 상단 흰 벽
  px(0,46,W,44,'#dcd9d0');
  // OSB 합판 벽
  px(0,90,W,FLOOR-90,'#c9a86a');
  px(0,90,W,2,'#a8865a');
  for(let i=0;i<46;i++){
    px((i*37)%W, 96+((i*53)%(FLOOR-110)), 3, 1, i%3===0?'#b8945a':'#d8bc80');
  }
  // CROSSFIT ARCADE 로고 벽화 (가운데 아래쪽)
  px(140,184,16,3,'#3a3a3a');                  // 케틀벨 핸들
  px(138,186,3,9,'#3a3a3a'); px(155,186,3,9,'#3a3a3a');
  px(136,194,24,18,'#3a3a3a');                 // 몸통 테두리
  px(138,196,20,14,'#c8c8cc');                 // 회색 몸통
  px(141,198,6,4,'#eeeef2');                   // 하이라이트
  px(96,205,52,10,'#1a1a1a');                  // CROSSFIT 검정 배너
  text('CROSSFIT', 122, 213, 8, '#f0f0f0');
  text('ARCADE', 137, 233, 20, '#1a1a1a');     // 블록 레터 외곽
  text('ARCADE', 135, 231, 20, '#f0c020');     // 노랑
  // 배경 리그 (흰 기둥 + 파랑 크로스바)
  px(0,108,W,4,'#3a6ad4'); px(0,108,W,1,'#6a94e8');
  for(let i=0;i<3;i++){
    px(28+i*88,100,6,FLOOR-100,'#e8e6e0');
    px(28+i*88,100,6,10,'#3a6ad4');
    px(29+i*88,112,4,1,'#b8b5ac');
  }
  // 월볼샷 타겟: 세 기둥-크로스바 교차점 모두 설치
  [31,119,207].forEach(tx=>{
    x.fillStyle='#2a2622';
    x.beginPath(); x.arc(tx,110,9,0,Math.PI*2); x.fill();
    x.fillStyle='#e8453a';
    x.beginPath(); x.arc(tx,110,3,0,Math.PI*2); x.fill();
  });
  // 짐내스틱 링 (스트랩 + 나무 링)
  px(70,112,2,34,'#dcd9d0');
  x.strokeStyle='#b8945a'; x.lineWidth=2;
  x.beginPath(); x.arc(71,152,6,0,Math.PI*2); x.stroke();
  // 메디신볼
  x.fillStyle='#8a3a3a';                       // 메디신볼 (기둥 아래)
  x.beginPath(); x.arc(140,FLOOR-6,6,0,Math.PI*2); x.fill();
  px(135,FLOOR-8,10,1,'#6a2a2a');
  // 생일 배너
  px(15,50,240,24,'#2a2340');
  px(15,50,240,3,'#3d3355');
  text('★ 배주열 BIRTHDAY WOD ★', 135, 67, 12, '#ffd23f');
  // 검정 러버 타일 바닥
  px(0,FLOOR,W,H-FLOOR,'#232326');
  px(0,FLOOR,W,2,'#3a3a40');
  for(let i=0;i<5;i++) px(i*60,FLOOR,1,H-FLOOR,'#2e2e33');
  px(0,FLOOR+40,W,1,'#2e2e33');
  // 범퍼 플레이트: 무게별 한 줄씩 (파랑45×10 / 노랑35×9 / 초록25×8 / 회색15×10 / 검정10×12)
  const stacks=[['#2a6ad4',10],['#e8c22a',9],['#4ea84a',8],['#9a9aa2',10],['#1e1e22',12]];
  stacks.forEach(([col,n],s)=>{
    for(let k=0;k<n;k++){
      px(158+s*20, FLOOR-4-k*4, 18, 4, col);
      px(158+s*20, FLOOR-4-k*4, 18, 1, '#ffffff2e');
    }
  });
  // 벤치 + 파란 물통 (왼쪽)
  px(8,FLOOR-16,42,5,'#4a4a52');
  px(10,FLOOR-11,4,11,'#3a3a40'); px(44,FLOOR-11,4,11,'#3a3a40');
  px(58,FLOOR-12,10,12,'#3a6ad4');
}

// ---------- 바벨: 무게에서 플레이트 조합 자동 계산 (바 45lb + 사이드) ----------
function plateStack(side){
  const P=[45,35,25,15,10], res=[];
  let s=side;
  while(s>0){
    const p=P.find(v=>v<=s && s-v!==5);   // 5lb 잔여 방지
    if(!p) break;
    res.push(p); s-=p;
  }
  return res;
}
function drawBarbell(bx, by, lb){
  const SZ={45:[9,20],35:[8,18],25:[7,16],15:[6,13],10:[5,11]};
  const CL={45:'#2a6ad4',35:'#e8c22a',25:'#4ea84a',15:'#9a9aa2',10:'#1e1e22'};
  const CD={45:'#1e4fa8',35:'#c09a1e',25:'#3a8438',15:'#7e7e88',10:'#0a0a0e'};
  px(bx-27,by-1,54,2,'#6a6a72');           // 샤프트
  px(bx-27,by-1,54,1,'#8a8a92');
  let off=27;
  plateStack(Math.max(0,(lb-45)/2)).forEach(p=>{   // 큰 플레이트부터 안쪽에
    const w=SZ[p][0], h=SZ[p][1];
    px(bx+off,by-h/2,w,h,CL[p]);   px(bx+off+2,by-h/2+3,w-4,h-6,CD[p]);
    px(bx-off-w,by-h/2,w,h,CL[p]); px(bx-off-w+2,by-h/2+3,w-4,h-6,CD[p]);
    off+=w+1;
  });
  px(bx+off,by-3,3,6,'#8a8a92');           // 마구리
  px(bx-off-3,by-3,3,6,'#8a8a92');
}

// ---------- 상품: TYR CXT-2 (화이트/검솔, 파인 디테일 90x40) ----------
function drawShoe(sx,sy){
  const wht='#f6f6f2', shd='#e0e0d8', mesh='#eceae4', blk='#16161a',
        gry='#a2a2aa', gum='#d8b06a', gumD='#bf9648', tng='#dcdcd6';
  x.save(); x.translate(sx,sy); x.scale(0.5,0.5);
  const S=(a,b,w,h,c)=>{ x.fillStyle=c; x.fillRect(a,b,w,h); };

  // 검 아웃솔 (라운드 토)
  S(8,66,164,10,gum);
  S(4,62,14,10,gum);
  S(16,74,152,4,gumD);
  S(160,64,14,12,gum);
  // 미드솔 검정 스트라이프 + 힐 블록/회색 TPU
  S(20,58,130,10,blk);
  S(130,44,44,24,blk);
  S(140,52,28,10,gry);
  // 흰 어퍼: 낮은 토 박스 → 뱀프 → 높은 힐
  S(10,44,40,20,wht);
  S(6,50,10,14,wht);
  S(36,32,70,32,wht);
  S(96,22,62,40,wht);
  S(150,26,14,36,wht);
  // 메쉬 질감
  S(40,48,60,4,mesh);
  S(46,54,44,3,shd);
  S(14,58,30,3,shd);
  // 발목 카라 (검정 패딩 + 회색 라이닝)
  S(112,18,44,8,blk);
  S(148,24,12,10,blk);
  S(112,14,30,6,gry);
  // 텅 + TYR 패치
  S(62,10,26,24,tng);
  S(66,12,18,8,'#c8c8c2');
  // 레이스 (대각선 5줄)
  for(let k=0;k<5;k++){
    S(52+k*11, 26+k*5, 14, 4, wht);
    S(52+k*11, 30+k*5, 14, 2, shd);
  }
  // 사이드 절개 라인
  S(96,30,4,30,shd);
  S(120,34,4,26,shd);
  // 힐 TYR 로고
  S(126,30,22,10,'#2a2a30');
  S(129,33,4,4,'#f0f0f0'); S(135,33,3,4,'#f0f0f0'); S(140,33,4,4,'#f0f0f0');
  x.restore();
}

// ---------- 풀업 리그 ----------
function drawRig(rx, barY){
  px(rx-52,barY,104,4,'#3a6ad4');            // 파랑 바
  px(rx-52,barY,104,1,'#6a94e8');
  px(rx-56,barY-24,6,FLOOR-(barY-24),'#e8e6e0');   // 흰 기둥
  px(rx+50,barY-24,6,FLOOR-(barY-24),'#e8e6e0');
  px(rx-56,barY-24,6,6,'#3a6ad4'); px(rx+50,barY-24,6,6,'#3a6ad4');  // 파랑 캡
}

// ---------- 애슬릿 (남자, 2배 디테일 스프라이트) ----------
// pose: setup | pull | extend | overhead | ohstand | hang | kip | pullup | dip | support | du | stumble
// 내부는 파인 좌표(코스 1px = 파인 2px), ctx.scale(0.5)로 기존 크기 유지
function drawAthlete(ax, ay, pose, opt){
  const skin='#f2cba6', skinD='#dfb28c', hair='#3a2c22', hairD='#2c211a',
        top='#f2803a', topD='#1e2a52',
        shorts='#2a6ad4', shortsD='#1e4fa8', sock='#f4f4f2';
  const wob = (pose==='stumble') ? Math.sin(t*0.6)*4 : 0;
  const jumpOff = (pose==='du' && opt && opt.jump) ? opt.jump*10 : 0;

  x.save();
  x.translate(ax, ay - jumpOff);
  x.scale(0.5, 0.5);
  const L=(a,b,w,h,c)=>{ x.fillStyle=c; x.fillRect(a,b,w,h); };

  // 얼굴: 앞머리 있는 다크브라운 + 또렷한 눈
  function headF(hx,hy){
    L(hx-2,hy-6,24,10,hair);            // 윗머리 볼륨
    L(hx,hy-6,20,3,hairD);              // 정수리 음영
    L(hx-4,hy-2,5,13,hair);             // 옆머리
    L(hx+19,hy-2,5,13,hair);
    L(hx,hy+2,20,16,skin);              // 얼굴
    L(hx,hy+16,20,2,skinD);             // 턱선 음영
    L(hx,hy+2,20,3,hair);               // 뱅 베이스
    L(hx+1,hy+5,4,2,hair);              // 앞머리 갈래
    L(hx+8,hy+5,3,2,hair);
    L(hx+15,hy+5,4,2,hair);
    L(hx+3,hy+9,4,4,'#2a2a2a');         // 눈
    L(hx+13,hy+9,4,4,'#2a2a2a');
    L(hx+4,hy+9,1,1,'#f0f0f0');         // 눈 하이라이트
    L(hx+14,hy+9,1,1,'#f0f0f0');
    L(hx+9,hy+12,2,3,skinD);            // 코
    L(hx+6,hy+16,8,2,'#d4939a');        // 입술
  }
  // 레알 24-25 어웨이 (파인 디테일)
  function jerseyF(jx,jy,wd,ht){
    jx-=2; wd+=4; ht+=4;                // 오버핏
    L(jx,jy,wd,ht,top);
    L(jx+4,jy,wd-8,2,topD);             // 네이비 크루넥
    for(let k=0;k<3;k++){               // 아디다스 어깨 3선
      L(jx+1+k*3,jy+2,2,4,topD);
      L(jx+wd-3-k*3,jy+2,2,4,topD);
    }
    L(jx+3,jy+8,4,3,'#3a3a40');         // 아디다스 로고
    L(jx+wd-7,jy+8,4,5,'#3a3a40');      // 크레스트
    L(jx+5,jy+15,wd-10,2,'#2f2f38');    // Emirates
    L(jx+7,jy+18,wd-14,1,'#3a3a40');    // FLY BETTER
    L(jx,jy+ht-9,3,3,'#d96a28');        // 대각 패턴
    L(jx+wd-4,jy+ht-10,3,3,'#d96a28');
    L(jx+(wd>>1)-2,jy+ht-5,5,2,'#d96a28');
    L(jx+6,jy+ht-7,3,2,'#e8763a');
    L(jx,jy+ht-2,wd,2,'#e8763a');       // 밑단
  }
  // 곧은 다리: 짧은 반바지(밑단) → 맨다리 → 나이키 양말(스우시)
  function legF(lx,ly,w,h){
    const s1=Math.round(h*0.3), s2=Math.round(h*0.42);
    L(lx,ly,w,s1,shorts);
    L(lx,ly+s1-2,w,2,shortsD);          // 반바지 밑단
    L(lx,ly+s1,w,s2,skin);
    L(lx+w-2,ly+s1,2,s2,skinD);         // 다리 음영
    L(lx,ly+s1+s2,w,h-s1-s2,sock);
    L(lx+w-3,ly+s1+s2+2,2,2,'#1a1a1a'); // 스우시
  }
  // 메트콘9: 어두운 어퍼 + 흰 미드솔 + 검정 아웃솔
  function footF(fx,fy,w){
    L(fx,fy,w,3,'#2a2a30');
    L(fx+1,fy,3,2,'#3d3d48');           // 어퍼 하이라이트
    L(fx,fy+3,w,2,'#f0f0f0');
    L(fx,fy+5,w,1,'#1a1a1a');
  }
  // 엑스포디움: 카키 스티키 그립 + 검정 손목 아대
  function gripF(gx,gy,w){
    L(gx,gy,w,5,'#9aa06a');
    L(gx,gy+1,w,1,'#b0b67e');
    L(gx,gy+8,w,4,'#1a1a1a');
  }

  if(pose==='setup'){
    // 스내치 스타트: 딥 스쿼트, 와이드 그립
    headF(4,-80);
    jerseyF(-2,-62,24,22);
    for(let k=0;k<5;k++){                       // 어깨→바깥 그립, 촘촘한 대각선
      L(-8-3*k,-56+8*k,8,12,skin);              // 왼팔
      L(20+3*k,-56+8*k,8,12,skin);              // 오른팔
    }
    L(-6,-44,24,15,shorts);                   // 엉덩이~허벅지
    L(-6,-31,24,2,shortsD);
    L(12,-26,8,8,skin);  L(12,-18,8,12,sock);  // 앞 정강이
    L(-6,-26,8,8,skin);  L(-6,-18,8,12,sock);  // 뒷 정강이
    footF(-8,-6,18); footF(10,-6,20);
  }
  else if(pose==='pull'){
    headF(6,-92);
    jerseyF(0,-74,28,24);
    L(-6,-70,8,26,skin);                       // 와이드 그립 팔
    L(26,-70,8,26,skin);
    legF(0,-50,12,44); legF(14,-50,12,44);
    footF(-2,-6,16); footF(14,-6,16);
  }
  else if(pose==='extend'){
    headF(0,-112);
    jerseyF(-2,-94,24,26);
    L(-14,-92,10,10,skin);  L(-14,-84,8,16,skin);   // 팔꿈치 바깥·위
    L(24,-92,10,10,skin);   L(24,-84,8,16,skin);
    legF(0,-68,10,56); legF(12,-68,10,56);
    footF(0,-12,12); footF(12,-12,12);              // 발끝
  }
  else if(pose==='overhead'){
    headF(0,-84);
    jerseyF(-2,-66,24,20);
    L(-10,-80,8,16,skin);  L(-18,-98,8,20,skin);   // 와이드 락아웃 (V자, 스타트 그립 폭)
    L(22,-80,8,16,skin);   L(30,-98,8,20,skin);
    L(-6,-46,16,16,shorts);  L(14,-46,16,16,shorts);   // 스쿼트 허벅지
    L(-6,-32,16,2,shortsD);  L(14,-32,16,2,shortsD);
    L(-10,-30,16,10,skin);   L(18,-30,16,10,skin);
    L(-10,-20,16,14,sock);   L(18,-20,16,14,sock);
    footF(-12,-6,18); footF(18,-6,18);
  }
  else if(pose==='ohstand'){
    headF(0,-104);
    jerseyF(-2,-86,24,28);
    L(-10,-100,8,16,skin);  L(-18,-118,8,20,skin); // 와이드 락아웃 (V자, 스타트 그립 폭)
    L(22,-100,8,16,skin);   L(30,-118,8,20,skin);
    legF(0,-58,10,52); legF(12,-58,10,52);
    footF(-2,-6,14); footF(12,-6,14);
  }
  else if(pose==='hang'){
    L(-6,4,6,28,skin);  L(18,4,6,28,skin);
    gripF(-6,-2,6); gripF(18,-2,6);
    headF(-2,28);
    jerseyF(-2,46,22,26);
    legF(0,72+wob,8,24); legF(10,72-wob,8,24);
    footF(-2,96,12); footF(10,96,12);
  }
  else if(pose==='kip'){
    L(-6,4,6,26,skin);  L(18,4,6,26,skin);
    gripF(-6,-2,6); gripF(18,-2,6);
    headF(-6,26);
    jerseyF(-4,44,24,24);
    L(6,68,10,20,shorts);  L(6,84,10,2,shortsD);   // 허벅지 뒤로
    L(14,84,6,10,skin);
    L(18,90,8,8,sock);
    footF(20,96,12); footF(8,84,10);
  }
  else if(pose==='pullup'){
    headF(-2,-16);
    L(-10,0,10,12,skin);  L(20,0,10,12,skin);
    gripF(-10,-2,10); gripF(20,-2,10);
    jerseyF(-2,2,22,24);
    legF(0,26,8,20); legF(10,26,8,20);
    footF(-2,46,12); footF(10,46,12);
  }
  else if(pose==='dip'){
    headF(-2,-36);
    jerseyF(-2,-18,22,22);
    L(-10,-16,8,18,skin);  L(20,-16,8,18,skin);
    gripF(-10,-2,8); gripF(20,-2,8);
    legF(0,4,8,20); legF(10,4,8,20);
    footF(-2,24,12); footF(10,24,12);
  }
  else if(pose==='support'){
    headF(-2,-64);
    jerseyF(-2,-46,22,26);
    L(-10,-44,8,24,skin);  L(20,-44,8,24,skin);
    gripF(-10,-22,8); gripF(20,-22,8);
    legF(0,-20,8,20); legF(10,-20,8,20);
    footF(-2,0,12); footF(10,0,12);
  }
  else if(pose==='hollow'){
    // 할로우: 어깨 뒤로 빠지고 다리는 앞으로 (접시 모양)
    L(-6,4,6,26,skin);  L(18,4,6,26,skin);
    gripF(-6,-2,6); gripF(18,-2,6);
    headF(-4,26);
    jerseyF(0,46,22,24);
    L(10,70,14,10,shorts);              // 허벅지 앞으로
    L(18,80,8,10,skin);
    L(24,88,8,10,sock);
    footF(26,98,12);
  }
  else if(pose==='hipdrive'){
    // 힙 드라이브: 힙을 바 쪽으로, 몸 수평, 발끝 위로 킥
    L(-6,4,6,16,skin);  L(18,4,6,16,skin);   // 당기면서 팔 짧아짐
    gripF(-6,-2,6); gripF(18,-2,6);
    headF(-10,14);
    jerseyF(-4,20,26,18);                    // 몸통 수평
    L(20,26,12,12,shorts);                   // 힙~허벅지 바 쪽
    L(26,14,8,12,skin);
    L(30,4,8,10,sock);
    footF(32,-6,12);                         // 발끝이 바 높이까지
  }
  else if(pose==='rack'){
    // 프론트 랙: 바 어깨 위, 팔꿈치 전방
    headF(0,-104);
    jerseyF(-2,-86,24,28);
    L(18,-88,10,8,skin);   L(26,-86,8,6,skin);   // 팔꿈치 들림
    L(-6,-88,10,8,skin);   L(-14,-86,8,6,skin);
    legF(0,-58,10,52); legF(12,-58,10,52);
    footF(-2,-6,14); footF(12,-6,14);
  }
  else if(pose==='jerk'){
    // 스플릿 저크: 바 오버헤드 + 앞뒤 스플릿 스탠스
    headF(0,-100);
    jerseyF(-2,-82,24,26);
    L(-8,-96,8,14,skin);   L(-12,-114,8,20,skin);
    L(20,-96,8,14,skin);   L(24,-114,8,20,skin);
    // 앞다리: 무릎 앞으로 굽힘 (런지)
    L(10,-52,18,10,shorts); L(10,-44,18,2,shortsD);  // 허벅지 수평 전방
    L(22,-42,8,18,skin);                             // 무릎 아래 수직
    L(22,-24,8,18,sock);
    footF(20,-6,18);
    // 뒷다리: 뒤로 뻗어 대각선
    L(-8,-52,14,10,shorts);
    L(-14,-44,8,16,skin);
    L(-22,-30,8,24,sock);
    footF(-26,-6,16);
  }
  else if(pose==='du'){
    headF(0,-96);
    jerseyF(-2,-78,24,26);
    L(-8,-72,8,18,skin);  L(18,-72,8,18,skin);
    legF(0,-52,10,28); legF(12,-52,10,28);
    footF(-2,-24,14); footF(12,-24,14);
  }
  else if(pose==='stumble'){
    headF(8+wob,-92);
    jerseyF(4+wob,-74,24,26);
    L(-4,-72,8,20,skin);  L(26,-76,8,20,skin);
    legF(4,-48,10,42); legF(16,-48,10,42);
    footF(2,-6,14); footF(18,-6,14);
    L(32,-100,4,6,'#8be0d8');                  // 땀
  }

  x.restore();

  // 더블언더 로프 (코스 좌표)
  if(pose==='du'){
    const jy = ay - jumpOff;
    const spin = opt ? opt.spin : 0;
    x.strokeStyle='#8be0d8'; x.lineWidth=1;
    x.beginPath();
    if((spin>>1)&1){  // 머리 위
      x.arc(ax+5, jy-30, 26, Math.PI*1.05, Math.PI*1.95);
    } else {          // 발 아래
      x.arc(ax+5, jy-30, 26, Math.PI*0.05, Math.PI*0.95);
    }
    x.stroke();
    px(ax-5,jy-30,2,3,'#f0c020'); px(ax+14,jy-30,2,3,'#f0c020');  // 손잡이
  }
}

// ---------- 동작 씬 ----------
const AX = 128;
const RIG_Y = 230;   // 철봉 높이 (배경 배너와 안 겹치게 낮춤)
const SCALE = 1.7;    // 동작 잘 보이게 확대

// 월볼샷: 1인칭 줌 시점 (공+타겟 클로즈업, 사람은 팔만)
function drawWbScene(){
  // OSB 벽 클로즈업
  px(0,0,W,H,'#c9a86a');
  for(let i=0;i<70;i++){
    px((i*37)%W, (i*53)%H, 4, 2, i%3===0?'#b8945a':'#d8bc80');
  }
  // 리그 기둥 클로즈업
  px(118,0,20,H,'#e8e6e0');
  px(118,0,4,H,'#c8c5bc');
  // 대형 타겟
  x.fillStyle='#2a2622'; x.beginPath(); x.arc(135,150,34,0,Math.PI*2); x.fill();
  x.fillStyle='#3d382e'; x.beginPath(); x.arc(135,150,26,0,Math.PI*2); x.fill();
  x.fillStyle='#e8453a'; x.beginPath(); x.arc(135,150,10,0,Math.PI*2); x.fill();
  px(128,140,5,4,'#ffffff55');

  // 공 위치
  let bx=135, by=300+Math.sin(t*0.12)*3, br=20, impact=false, gone=false;
  if(phase==='result' && judgment){
    if(judgment.pts>0){
      const p2 = Math.min(1, frame/9);
      by = 300 - p2*150; br = 20 - p2*8;
      if(frame>=9){ impact=true; gone=true; }
    } else if(judgment.text==='EARLY!'){
      const fall = Math.max(0, frame-8);
      by = 300 - Math.min(1,frame/8)*90 + fall*fall*0.9;   // 못 미치고 낙하
      br = 16;
      if(by>H+30) gone=true;
    }
  }

  if(impact && frame<20){           // 명중 링 이펙트
    x.strokeStyle='#ffd23f'; x.lineWidth=3;
    x.beginPath(); x.arc(135,150,12+(frame-9)*3,0,Math.PI*2); x.stroke();
  }
  if(!gone){                        // 월볼 (버건디 + 20lb 주황 띠)
    x.fillStyle='#8a3a3a'; x.beginPath(); x.arc(bx,by,br,0,Math.PI*2); x.fill();
    x.save();
    x.beginPath(); x.arc(bx,by,br,0,Math.PI*2); x.clip();
    px(bx-br,by-br*0.3,br*2,br*0.6,'#f2803a');            // 주황 띠
    px(bx-br,by-br*0.3,br*2,2,'#d96a28');
    px(bx-br,by+br*0.3-2,br*2,2,'#d96a28');
    x.restore();
    px(bx-1,by-br,2,br*2,'#6a2a2a');
    x.fillStyle='#a85050'; x.beginPath(); x.arc(bx-br*0.35,by-br*0.45,br*0.22,0,Math.PI*2); x.fill();
  }

  // 1인칭 팔 (공 던지면 아래에서 대기) — 소매→전완→손 대각선으로 연결
  const holding = !(phase==='result' && judgment && (judgment.pts>0 || judgment.text==='EARLY!'));
  const hy = holding ? by : 322;
  px(58, hy+42, 34, Math.max(0, 404-(hy+42)), '#f2803a');   // 왼 소매
  px(178, hy+42, 34, Math.max(0, 404-(hy+42)), '#f2803a');
  px(66,hy+32,20,18,'#f2cba6');   px(80,hy+17,20,18,'#f2cba6');   px(94,hy+2,20,18,'#f2cba6');   // 왼 전완 대각
  px(184,hy+32,20,18,'#f2cba6');  px(170,hy+17,20,18,'#f2cba6');  px(156,hy+2,20,18,'#f2cba6');  // 오른 전완 대각
  px(135-br-8, hy-8, 16, 22, '#f2cba6');                     // 손 (공 감쌈)
  px(135+br-8, hy-8, 16, 22, '#f2cba6');
}

function drawScene(){
  if(curMove==='wb'){ drawWbScene(); return; }
  drawGym();

  // 벽에 걸린 무게 화이트보드 (바벨 랩)
  if((curMove==='snatch'||curMove==='cj') && curWeight()){
    px(18,124,68,36,'#8a8fa0');
    px(20,126,64,32,'#f6f6f2');
    text('TODAY', 52, 137, 8, '#8a8fa0');
    text(curWeight()+'lb', 52, 153, 14, '#1e2a52');
  }

  x.save();
  x.translate(AX, FLOOR); x.scale(SCALE, SCALE); x.translate(-AX, -FLOOR);

  const kg = curWeight();

  if(curMove==='snatch'){
    if(phase==='ready' || phase==='run'){
      drawAthlete(AX, FLOOR, 'setup');
      drawBarbell(AX+6, FLOOR-8, kg);
    } else {
      if(judgment && judgment.pts>0){
        // 풀 → 익스텐션 → 캐치 → 스탠드업, 바는 항상 손 높이에 고정
        if(frame<8){
          drawAthlete(AX, FLOOR, 'pull');
          drawBarbell(AX+6, FLOOR-8-(frame/8)*15, kg);       // 바닥→허벅지(손)
        } else if(frame<16){
          drawAthlete(AX, FLOOR, 'extend');
          drawBarbell(AX+6, FLOOR-23-((frame-8)/8)*13, kg);  // 허벅지→익스텐션 손 높이
        } else if(frame<28){
          drawAthlete(AX, FLOOR, 'overhead');
          drawBarbell(AX+6, FLOOR-49, kg);                   // 캐치: 머리 위 손
        } else {
          drawAthlete(AX, FLOOR, 'ohstand');
          drawBarbell(AX+6, FLOOR-59, kg);                   // 락아웃 손 위
        }
      } else {
        drawAthlete(AX, FLOOR, 'stumble');
        drawBarbell(AX+6, FLOOR-8, kg);
      }
    }
  }
  else if(curMove==='bmu'){
    drawRig(AX+5, RIG_Y);
    if(phase==='ready' || phase==='run'){
      // 대기 중 스윙: 할로우 ↔ 아치 왕복 (천천히)
      const sw = Math.sin(t*0.045);
      const swingPose = sw>0.4 ? 'kip' : (sw<-0.4 ? 'hollow' : 'hang');
      drawAthlete(AX+sw*3, RIG_Y, swingPose);
    } else {
      if(judgment && judgment.pts>0){
        // 할로우 → 아치 → 힙드라이브 → 하이풀 → 트랜지션 → 서포트
        if(frame<8) drawAthlete(AX, RIG_Y, 'hollow');
        else if(frame<16) drawAthlete(AX, RIG_Y, 'kip');
        else if(frame<26) drawAthlete(AX, RIG_Y, 'hipdrive');
        else if(frame<36) drawAthlete(AX, RIG_Y, 'pullup');
        else if(frame<46) drawAthlete(AX, RIG_Y-2, 'dip');
        else drawAthlete(AX, RIG_Y-2, 'support');
      } else {
        drawAthlete(AX, RIG_Y, 'hang');
        if((frame>>2)&1) text('!', AX+22, RIG_Y+18, 12, '#ff5a5a');
      }
    }
  }
  else if(curMove==='cj'){
    if(phase==='ready' || (phase==='run' && cjStage===0)){
      drawAthlete(AX, FLOOR, 'setup');
      drawBarbell(AX+6, FLOOR-8, kg);
    } else if(phase==='mid' || (phase==='run' && cjStage===1)){
      drawAthlete(AX, FLOOR, 'rack');
      drawBarbell(AX+4, FLOOR-46, kg);
    } else { // result
      if(judgment && judgment.pts>0 && cjStage===1){
        if(frame<10){ drawAthlete(AX, FLOOR, 'rack'); drawBarbell(AX+4, FLOOR-46-(frame/10)*11, kg); }
        else { drawAthlete(AX, FLOOR, 'jerk'); drawBarbell(AX+4, FLOOR-57, kg); }
      } else {
        drawAthlete(AX, FLOOR, 'stumble');
        drawBarbell(AX+6, FLOOR-8, kg);   // 바 떨어뜨림
      }
    }
  }
  else { // du
    if(phase==='ready' || phase==='run'){
      // 계속 콩콩 뛰면서 대기
      const jump = Math.abs(Math.sin(t*0.18));
      drawAthlete(AX, FLOOR, 'du', {jump:jump*0.4, spin:t>>2});
    } else {
      if(judgment && judgment.pts>0){
        // 성공: 높은 점프 + 빠른 로프 스핀 (더블!)
        const jp = Math.sin((frame/12)*Math.PI);
        drawAthlete(AX, FLOOR, 'du', {jump:jp, spin:frame});
      } else {
        drawAthlete(AX, FLOOR, 'stumble');   // 줄 걸림
        x.strokeStyle='#8be0d8'; x.lineWidth=1;
        x.beginPath(); x.arc(AX+8, FLOOR-4, 12, 0, Math.PI); x.stroke();
      }
    }
  }

  x.restore();
}

// ---------- 타이밍 게이지 (하단 가로 바) ----------
function drawMeter(p){
  const mx = 20, my = 420, mw = 230, mh = 18;
  px(mx-2, my-2, mw+4, mh+4, '#2a2540');
  px(mx, my, mw, mh, '#14121c');
  const xOf = q => mx + Math.max(0,Math.min(1,q))*mw;
  px(xOf(zone.gLo), my, (zone.gHi-zone.gLo)*mw, mh, '#2e6e5a');
  px(xOf(zone.pLo), my, (zone.pHi-zone.pLo)*mw, mh, '#ffd23f');
  const markX = xOf(p);
  px(markX-2, my-5, 4, mh+10, '#ffffff');
  px(markX-2, my-5, 1, mh+10, '#8be0d8');
  text('TIMING', 135, my-10, 8, '#7a7292');
}

// ---------- 루프 ----------
function loop(){
  t++;
  x.save();
  x.scale(2,2);   // 내부 해상도 2배 — 배경 코드는 270x480 좌표계 유지
  if(shake>0){ x.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake); shake-=0.5; }

  if(state==='title'){
    drawGym();
    x.save();
    x.translate(AX, FLOOR); x.scale(SCALE, SCALE); x.translate(-AX, -FLOOR);
    drawAthlete(AX, FLOOR, 'ohstand');
    drawBarbell(AX+6, FLOOR-59, 95);
    x.restore();
    x.fillStyle='rgba(0,0,0,0.55)'; x.fillRect(0,60,W,140);
    text('BIRTHDAY', W/2, 100, 26, '#ffd23f');
    text('WOD', W/2, 130, 26, '#ffd23f');
    text('골드 존에서 탭! 퍼펙트를 노려라', W/2, 156, 10, '#f0ead8');
    text('스내치·월볼·머슬업·더블언더·클린&저크', W/2, 172, 10, '#8be0d8');
    if((t>>4)&1) text('▶ 탭해서 시작', W/2, 192, 12, '#8be0d8');
  }

  else if(state==='intro'){
    frame++;
    drawGym();
    const r = WOD[roundIdx];
    x.fillStyle='rgba(0,0,0,0.55)'; x.fillRect(0,140,W,110);
    text('ROUND '+(roundIdx+1), W/2, 168, 13, '#8be0d8');
    text(r.label+(r.weight&&r.move!=='alt'?' '+r.weight+'lb'+(r.wStep?'+':''):''), W/2, 194, 15, '#ffd23f');
    text('× '+r.reps, W/2, 214, 12, '#ffd23f');
    if(r.random) text('!! 판정 존이 랩마다 움직임 !!', W/2, 232, 9, '#ff9ec4');
    const cnt = 3 - (frame/30|0);
    if(frame%30===1 && cnt>0) sfx.count();
    if(cnt>0) text(cnt+'', W/2, 246, 11, '#f0ead8');
    if(frame>=90){ sfx.go(); state='play'; startRep(); updateHUD(); }
  }

  else if(state==='play'){
    frame++;
    drawScene();

    if(phase==='ready'){
      if((frame>>3)&1) text('READY...', W/2, 120, 11, '#2a2340');
      if(frame>=readyDur()){ phase='run'; frame=0; }
    }
    else if(phase==='run'){
      const p = frame/repDur;
      drawMeter(p);
      if(p>=1) judge(1.1);
    }
    else if(phase==='mid'){
      // 클린 캐치 → 저크 게이지 준비
      if(frame>=16){ setZone(); repDur=Math.max(26, repDur*0.85); phase='run'; frame=0; }
    }
    else if(phase==='result'){
      if(frame>=resultDur()) nextRep();
    }

    if(combo>=2){
      text(combo+' COMBO', W/2+1, 63, 13, '#00000066');
      text(combo+' COMBO', W/2, 62, 13, combo>=5?'#ffd23f':'#8be0d8');
    }
  }

  else if(state==='done'){
    drawGym();
    x.save();
    x.translate(AX, FLOOR); x.scale(SCALE, SCALE); x.translate(-AX, -FLOOR);
    drawAthlete(AX, FLOOR, 'ohstand');
    drawBarbell(AX+6, FLOOR-59, 135);
    x.restore();
    x.fillStyle='rgba(0,0,0,0.78)'; x.fillRect(0,52,W,254);

    const total = perfects+goods+misses;
    const rate = total? perfects/total : 0;
    const grade = rate>=0.85 ? "RX'D! 완벽한 애슬릿 ★" : rate>=0.55 ? '좋아! 폼 조금만 더!' : '스케일드... 재도전?';

    text('WOD COMPLETE!', W/2, 80, 18, '#ffd23f');
    text('SCORE  '+score, W/2, 106, 15, '#f0ead8');
    text('PERFECT '+perfects+' · GOOD '+goods, W/2, 128, 10, '#8be0d8');
    text('NO REP '+misses+' · MAX COMBO '+maxCombo, W/2, 143, 10, '#8be0d8');
    text('총 리프팅 '+tonnage+'lb', W/2, 158, 10, '#8be0d8');
    text(grade, W/2, 178, 12, '#ff9ec4');
    text('생일 축하해!', W/2, 196, 15, '#ffd23f');

    // 상품 연출: TYR CXT-3
    drawShoe(90, 208);
    for(let i=0;i<6;i++){                        // 반짝이
      if(((t>>3)+i)%3===0){
        const spx = 78 + i*24, spy = 210 + ((i*17)%32);
        px(spx,spy,2,2,'#ffd23f'); px(spx-2,spy,1,2,'#ffd23f88'); px(spx+3,spy,1,2,'#ffd23f88');
      }
    }
    text('★ 상품: TYR CXT-3 획득! ★', W/2, 262, 11, '#ffd23f');
    if((t>>4)&1) text('▶ 탭해서 다시 도전', W/2, 286, 10, '#7a7292');
    // 하트
    for(let i=0;i<3;i++){
      const hy = 330 - ((t*0.6+i*30)%60);
      const hx = 50 + i*80 + Math.sin(t*0.05+i)*6;
      const a = 1-((t*0.6+i*30)%60)/60;
      x.fillStyle=`rgba(255,158,196,${a})`;
      x.fillRect(hx,hy,2,2); x.fillRect(hx+4,hy,2,2);
      x.fillRect(hx-1,hy+2,8,2); x.fillRect(hx+1,hy+4,4,2); x.fillRect(hx+2,hy+6,2,2);
    }
  }

  // 초크 파티클
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx; p.y+=p.vy; p.vy+=0.06; p.life--;
    if(p.life<=0){ particles.splice(i,1); continue; }
    x.fillStyle=p.col; x.fillRect(p.x|0,p.y|0,2,2);
  }
  // 판정 팝업
  for(let i=popups.length-1;i>=0;i--){
    const p=popups[i];
    p.y-=0.6; p.life--;
    if(p.life<=0){ popups.splice(i,1); continue; }
    const fs = p.text.length>4?18:14;
    text(p.text, W/2+1, p.y+1, fs, '#00000077');
    text(p.text, W/2, p.y, fs, p.col);
  }

  x.restore();
  requestAnimationFrame(loop);
}

updateHUD();
loop();
</script>
