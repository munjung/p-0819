<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>BIRTHDAY WOD</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Galmuri11:wght@400;700&display=swap');
  * { margin:0; padding:0; box-sizing:border-box;
    -webkit-touch-callout:none; -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color:transparent; }
  body {
    background:#0d0b12;
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; padding:12px;
    font-family:'Galmuri11', monospace; color:#f0ead8;
  }
  #wrap { width:100%; max-width:400px; }
  #hud { display:flex; justify-content:space-between; align-items:flex-end;
    margin-bottom:8px; font-size:12px; letter-spacing:0.5px; }
  #roundLabel { color:#ffd23f; }
  canvas { width:100%; display:block;
    border:3px solid #2e2a3d; border-radius:4px;
    image-rendering:pixelated; background:#14121c; touch-action:none; }
  #hint { margin-top:8px; font-size:10px; color:#7a7292; line-height:1.7; text-align:center; }
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">
    <div id="roundLabel">BIRTHDAY WOD</div>
    <div style="display:flex; gap:12px; align-items:flex-end">
      <div id="mute" style="cursor:pointer; color:#7a7292">♪ ON</div>
      <div id="scoreLabel">SCORE 0</div>
    </div>
  </div>
  <canvas id="c" width="270" height="480"></canvas>
  <div id="hint">게이지가 골드 존에 왔을 때 탭! · 미리 누르면 NO REP!</div>
</div>

<script>
const c = document.getElementById('c');
const x = c.getContext('2d');
x.imageSmoothingEnabled = false;

const W = 270, H = 480;
const FLOOR = 360;

// ---------- WOD 정의 ----------
// pw/gw: 퍼펙트/굿 존 반폭, random: 존 위치 랩마다 랜덤
const WOD = [
  { move:'snatch', label:'스내치',           weight:40, reps:8,  dur:92, pw:0.045, gw:0.105, random:false },
  { move:'bmu',    label:'바 머슬업',         weight:0,  reps:8,  dur:78, pw:0.040, gw:0.100, random:true  },
  { move:'du',     label:'더블언더',          weight:0,  reps:16, dur:34, pw:0.050, gw:0.110, random:false },
  { move:'alt',    label:'스내치 60kg + 머슬업', weight:60, reps:10, dur:62, pw:0.032, gw:0.085, random:true  },
];

let state = 'title';   // title | intro | play | done
let roundIdx = 0, repIdx = 0;
let phase = 'ready';   // ready | run | result
let frame = 0;
let curMove = 'snatch';
let repDur = 90;
let zone = {pLo:0.8, pHi:0.89, gLo:0.72, gHi:0.93};
let judgment = null;
let combo = 0, maxCombo = 0, score = 0;
let perfects = 0, goods = 0, misses = 0, tonnage = 0;
let t = 0, shake = 0;
let particles = [];
let popups = [];

// ---------- 사운드 ----------
let AC = null, muted = false;
function audioInit(){
  if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(_){ return; } }
  if(AC.state==='suspended') AC.resume();
}
function beep(freq, dur, type='square', vol=0.12, slide=0){
  if(!AC || muted) return;
  const o=AC.createOscillator(), g=AC.createGain();
  o.type=type;
  o.frequency.setValueAtTime(freq, AC.currentTime);
  if(slide) o.frequency.linearRampToValueAtTime(Math.max(40,freq+slide), AC.currentTime+dur);
  g.gain.setValueAtTime(vol, AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime+dur);
  o.connect(g); g.connect(AC.destination);
  o.start(); o.stop(AC.currentTime+dur);
}
const sfx = {
  count(){ beep(440, 0.1, 'square', 0.1); },
  go(){ beep(880, 0.22, 'square', 0.12); },
  perfect(){ [784,988,1319].forEach((f,i)=>setTimeout(()=>beep(f,0.1,'square',0.11), i*55)); },
  good(){ beep(660, 0.1, 'square', 0.1); },
  norep(){ beep(150, 0.3, 'sawtooth', 0.15, -80); },
  du(){ beep(990, 0.05, 'square', 0.09); },
  clear(){ [523,659,784,1047,1319].forEach((f,i)=>setTimeout(()=>beep(f,0.15,'square',0.1), i*120)); },
};
const muteEl = document.getElementById('mute');
function toggleMute(){ muted=!muted; muteEl.textContent = muted?'♪ OFF':'♪ ON'; }
muteEl.addEventListener('pointerdown', e=>{ e.preventDefault(); audioInit(); toggleMute(); });

// ---------- 입력 ----------
function action(){
  audioInit();
  if(state==='title'){ startWOD(); return; }
  if(state==='done'){ if(t>60){ state='title'; t=0; updateHUD(); } return; }
  if(state==='play'){
    if(phase==='run') judge(frame / repDur);
    else if(phase==='ready') judge(0);   // 부정출발도 NO REP
  }
}
addEventListener('keydown', e=>{
  if(e.code==='Space'||e.code==='ArrowUp'){ e.preventDefault(); if(!e.repeat) action(); }
  if(e.code==='KeyM'){ audioInit(); toggleMute(); }
});
c.addEventListener('pointerdown', e=>{ e.preventDefault(); action(); });
['contextmenu','selectstart','dragstart'].forEach(ev=>document.addEventListener(ev, e=>e.preventDefault()));
document.addEventListener('gesturestart', e=>e.preventDefault());

// ---------- 진행 ----------
function curWeight(){ return WOD[roundIdx].weight; }
function readyDur(){ return curMove==='du' ? 10 : 32; }
function resultDur(){
  const ok = judgment && judgment.pts>0;
  if(curMove==='du') return ok ? 12 : 30;
  return ok ? 56 : 42;
}
function pickMove(){
  const m = WOD[roundIdx].move;
  curMove = (m==='alt') ? (repIdx%2===0 ? 'snatch' : 'bmu') : m;
}
function startWOD(){
  state='intro'; roundIdx=0; repIdx=0; frame=0; t=0;
  combo=0; maxCombo=0; score=0; perfects=0; goods=0; misses=0; tonnage=0;
  particles=[]; popups=[];
  updateHUD();
}
function startRep(){
  phase='ready'; frame=0; judgment=null; pickMove();
  const r = WOD[roundIdx];
  // 속도: 랩 진행 + 랜덤 편차
  repDur = Math.max(28, r.dur - repIdx*1.5 + (Math.random()*10-5));
  // 존 위치: random 라운드는 랩마다 이동 (타이밍 암기 방지)
  const zc = r.random ? 0.55 + Math.random()*0.3 : 0.845;
  zone = { pLo:zc-r.pw, pHi:zc+r.pw, gLo:zc-r.gw, gHi:zc+r.gw };
}
function judge(p){
  let res;
  if(p>=zone.pLo && p<=zone.pHi){
    combo++; perfects++;
    const pts = 100 + combo*10;
    score += pts;
    res = {text:'PERFECT!', col:'#ffd23f', pts};
    if(curMove==='du') sfx.du(); else sfx.perfect();
    shake=5; chalk(20);
  } else if(p>=zone.gLo && p<=zone.gHi){
    combo++; goods++;
    const pts = 50 + combo*5;
    score += pts;
    res = {text:'GOOD', col:'#8be0d8', pts};
    sfx.good(); chalk(8);
  } else {
    combo=0; misses++;
    res = {text:p<zone.gLo?'EARLY!':'NO REP!', col:'#ff5a5a', pts:0};
    sfx.norep(); shake=7;
  }
  if(res.pts && curMove==='snatch') tonnage += curWeight();
  maxCombo = Math.max(maxCombo, combo);
  judgment = res;
  popups.push({text:res.text, col:res.col, y:150, life:40});
  if(res.pts) popups.push({text:'+'+res.pts, col:'#f0ead8', y:172, life:40});
  phase='result'; frame=0;
  updateHUD();
}
function nextRep(){
  repIdx++;
  if(repIdx >= WOD[roundIdx].reps){
    roundIdx++;
    repIdx=0;
    if(roundIdx >= WOD.length){ state='done'; t=0; sfx.clear(); return; }
    state='intro'; frame=0;
    updateHUD();
  } else { startRep(); updateHUD(); }
}
function updateHUD(){
  const r = WOD[roundIdx];
  document.getElementById('roundLabel').textContent =
    (state==='play'||state==='intro')
      ? `R${roundIdx+1}/${WOD.length} ${r.label} ${repIdx+1}/${r.reps}`
      : 'BIRTHDAY WOD';
  document.getElementById('scoreLabel').textContent = 'SCORE '+score;
}
function chalk(n){
  for(let i=0;i<n;i++) particles.push({
    x:135+Math.random()*30-15, y:FLOOR-110-Math.random()*40,
    vx:(Math.random()-.5)*3, vy:-Math.random()*2.5,
    life:20+Math.random()*20, col:'#ffffffcc'
  });
}

// ---------- 픽셀 헬퍼 ----------
function px(a,b,w,h,col){ x.fillStyle=col; x.fillRect(a|0,b|0,w,h); }
function text(str,cx,cy,size,col,align='center'){
  x.font=size+'px Galmuri11, monospace'; x.textAlign=align; x.fillStyle=col; x.fillText(str,cx,cy);
}

// ---------- 배경: 체육관 (세로) ----------
function drawGym(){
  px(0,0,W,H,'#14121c');
  for(let i=0;i<5;i++) px(i*54,0,1,FLOOR,'#1c1928');
  // 생일 배너
  px(15,12,240,24,'#2a2340');
  px(15,12,240,3,'#3d3355');
  text('★ HAPPY BIRTHDAY WOD ★', 135, 29, 12, '#ffd23f');
  // 플레이트 랙 (왼쪽)
  px(8,FLOOR-46,10,46,'#c94f5a'); px(20,FLOOR-40,8,40,'#4f7cc9'); px(30,FLOOR-32,7,32,'#f0c020');
  // 케틀벨 (오른쪽)
  px(236,FLOOR-16,16,16,'#3a3648'); px(240,FLOOR-22,8,8,'#3a3648'); px(242,FLOOR-20,4,4,'#14121c');
  // 러버 매트 바닥
  px(0,FLOOR,W,H-FLOOR,'#221e30');
  for(let i=0;i<5;i++) px(i*60,FLOOR,1,H-FLOOR,'#2a2540');
  px(0,FLOOR,W,2,'#332e48');
  // 조명
  for(let i=0;i<2;i++){
    px(50+i*130,0,40,6,'#3a3648');
    x.fillStyle='rgba(255,240,200,0.03)';
    x.beginPath(); x.moveTo(50+i*130,6); x.lineTo(30+i*130,FLOOR); x.lineTo(110+i*130,FLOOR); x.lineTo(90+i*130,6); x.fill();
  }
}

// ---------- 바벨 (무게 표시 + 60kg는 플레이트 2장) ----------
function drawBarbell(bx, by, kg){
  const heavy = kg>=50;
  px(bx-38,by-10,10,20,'#c94f5a'); px(bx-36,by-6,6,12,'#a83a45');
  px(bx+28,by-10,10,20,'#c94f5a'); px(bx+30,by-6,6,12,'#a83a45');
  if(heavy){  // 파란 플레이트 추가
    px(bx-46,by-9,8,18,'#4f7cc9'); px(bx-44,by-5,4,10,'#3a5f9e');
    px(bx+38,by-9,8,18,'#4f7cc9'); px(bx+40,by-5,4,10,'#3a5f9e');
  }
  px(bx-28,by-2,56,4,'#b8bcc8');
  px(bx-28,by-2,56,1,'#e0e4ec');
  if(kg) text(kg+'kg', bx, by-16, 9, '#ffd23f');
}

// ---------- 풀업 리그 ----------
function drawRig(rx, barY){
  px(rx-52,barY,104,4,'#8a8fa0');
  px(rx-52,barY,104,1,'#c8ccd8');
  px(rx-56,barY-24,6,FLOOR-(barY-24),'#2e2a3d');
  px(rx+50,barY-24,6,FLOOR-(barY-24),'#2e2a3d');
  px(rx-56,barY-24,6,3,'#3d3860'); px(rx+50,barY-24,6,3,'#3d3860');
}

// ---------- 애슬릿 (남자, 짧은 머리 + 은테 안경) ----------
// pose: setup | pull | extend | overhead | ohstand | hang | kip | pullup | dip | support | du | stumble
function drawAthlete(ax, ay, pose, opt){
  // ponytail: 레알마드리드 24-25 어웨이 (주황 + 네이비 트림)
  const skin='#f2cba6', hair='#241d1a', top='#f2803a', topD='#1e2a52',
        pants='#2e2a3d', shoe='#f0a838';
  const wobble = (pose==='stumble') ? Math.sin(t*0.6)*2 : 0;

  function head(hx,hy){
    px(hx-1,hy-2,12,4,hair);          // 짧은 머리
    px(hx-1,hy+1,2,4,hair);           // 구레나룻
    px(hx+9,hy+1,2,4,hair);
    px(hx,hy+1,10,8,skin);
    // 은테 안경
    px(hx+1,hy+3,3,2,'#c8c8d0');
    px(hx+6,hy+3,3,2,'#c8c8d0');
    px(hx+4,hy+3,2,1,'#c8c8d0');
    px(hx+1,hy+4,2,1,'#1a1a1a');
    px(hx+6,hy+4,2,1,'#1a1a1a');
    px(hx+3,hy+7,4,1,'#c8836a');
  }

  if(pose==='setup'){
    // 데드리프트 셋업
    head(ax+8, ay-34);
    px(ax-2,ay-27,16,10,top);
    px(ax-2,ay-27,16,2,topD);
    px(ax+10,ay-24,4,14,skin);
    px(ax+16,ay-24,4,14,skin);
    px(ax-2,ay-18,8,10,pants);
    px(ax,ay-8,7,8,pants);
    px(ax-1,ay-3,9,3,shoe);
    px(ax+8,ay-3,9,3,shoe);
  }
  else if(pose==='pull'){
    // 퍼스트 풀: 바 무릎~허벅지, 팔 아래로
    head(ax+3, ay-46);
    px(ax,ay-37,14,12,top);
    px(ax,ay-37,14,2,topD);
    px(ax+9,ay-35,4,13,skin);
    px(ax+14,ay-35,4,13,skin);
    px(ax,ay-25,6,12,pants);
    px(ax+7,ay-25,6,12,pants);
    px(ax-1,ay-3,8,3,shoe); px(ax+7,ay-3,8,3,shoe);
  }
  else if(pose==='extend'){
    // 익스텐션: 발끝 세우고 어깨 으쓱, 팔꿈치 높이
    head(ax, ay-56);
    px(ax-1,ay-47,12,13,top);
    px(ax-1,ay-47,12,2,topD);
    px(ax-5,ay-46,5,5,skin);       // 팔꿈치 올림
    px(ax-5,ay-42,4,8,skin);
    px(ax+9,ay-46,5,5,skin);
    px(ax+9,ay-42,4,8,skin);
    px(ax,ay-34,5,15,pants);
    px(ax+6,ay-34,5,15,pants);
    px(ax,ay-6,6,3,shoe); px(ax+6,ay-6,6,3,shoe);   // 발끝
  }
  else if(pose==='overhead'){
    // 오버헤드 스쿼트 캐치 (깊게)
    head(ax, ay-42);
    px(ax-1,ay-33,12,10,top);
    px(ax-1,ay-33,12,2,topD);
    px(ax-4,ay-48,4,16,skin);
    px(ax+9,ay-48,4,16,skin);
    px(ax-3,ay-23,8,8,pants);
    px(ax+7,ay-23,8,8,pants);
    px(ax-5,ay-15,8,12,pants);
    px(ax+9,ay-15,8,12,pants);
    px(ax-6,ay-3,9,3,shoe); px(ax+9,ay-3,9,3,shoe);
  }
  else if(pose==='ohstand'){
    // 오버헤드 스탠드업 (락아웃 완성)
    head(ax, ay-52);
    px(ax-1,ay-43,12,14,top);
    px(ax-1,ay-43,12,2,topD);
    px(ax-4,ay-58,4,16,skin);
    px(ax+9,ay-58,4,16,skin);
    px(ax,ay-29,5,26,pants);
    px(ax+6,ay-29,5,26,pants);
    px(ax-1,ay-3,7,3,shoe); px(ax+6,ay-3,7,3,shoe);
  }
  else if(pose==='hang'){
    // 풀업바 매달림 (ay = 바 y)
    px(ax-3,ay+2,3,14,skin);
    px(ax+9,ay+2,3,14,skin);
    head(ax-1, ay+14);
    px(ax-1,ay+23,11,13,top);
    px(ax-1,ay+23,11,2,topD);
    px(ax,ay+36+wobble,4,12,pants);
    px(ax+5,ay+36-wobble,4,12,pants);
    px(ax-1,ay+48,6,3,shoe); px(ax+5,ay+48,6,3,shoe);
  }
  else if(pose==='kip'){
    // 킵 스윙: 몸 활처럼, 다리 뒤로
    px(ax-3,ay+2,3,13,skin);
    px(ax+9,ay+2,3,13,skin);
    head(ax-3, ay+13);
    px(ax-2,ay+22,12,12,top);
    px(ax-2,ay+22,12,2,topD);
    px(ax+3,ay+34,5,10,pants);
    px(ax+7,ay+42,5,8,pants);
    px(ax+10,ay+48,6,3,shoe);
    px(ax+4,ay+42,5,3,shoe);
  }
  else if(pose==='pullup'){
    // 하이 풀: 가슴이 바 높이
    head(ax-1, ay-8);
    px(ax-5,ay,5,6,skin);
    px(ax+10,ay,5,6,skin);
    px(ax-1,ay+1,11,12,top);
    px(ax,ay+13,4,10,pants);
    px(ax+5,ay+13,4,10,pants);
    px(ax-1,ay+23,6,3,shoe); px(ax+5,ay+23,6,3,shoe);
  }
  else if(pose==='dip'){
    // 트랜지션: 상체 바 위로, 팔꿈치 굽힘
    head(ax-1, ay-18);
    px(ax-1,ay-9,11,11,top);
    px(ax-1,ay-9,11,2,topD);
    px(ax-5,ay-8,4,9,skin);
    px(ax+10,ay-8,4,9,skin);
    px(ax,ay+2,4,10,pants);
    px(ax+5,ay+2,4,10,pants);
    px(ax-1,ay+12,6,3,shoe); px(ax+5,ay+12,6,3,shoe);
  }
  else if(pose==='support'){
    // 바 위 서포트 락아웃
    head(ax-1, ay-32);
    px(ax-1,ay-23,11,13,top);
    px(ax-1,ay-23,11,2,topD);
    px(ax-5,ay-22,4,12,skin);
    px(ax+10,ay-22,4,12,skin);
    px(ax,ay-10,4,10,pants);
    px(ax+5,ay-10,4,10,pants);
    px(ax-1,ay,6,3,shoe); px(ax+5,ay,6,3,shoe);
  }
  else if(pose==='du'){
    // 더블언더 (opt.jump: 0~1 점프 높이, opt.spin: 로프 회전)
    const jy = ay - (opt&&opt.jump ? opt.jump*10 : 0);
    head(ax, jy-48);
    px(ax-1,jy-39,12,13,top);
    px(ax-1,jy-39,12,2,topD);
    px(ax-4,jy-36,4,9,skin);
    px(ax+9,jy-36,4,9,skin);
    px(ax,jy-26,5,14,pants);
    px(ax+6,jy-26,5,14,pants);
    px(ax-1,jy-12,7,3,shoe); px(ax+6,jy-12,7,3,shoe);
    // 줄넘기 로프
    const spin = opt ? opt.spin : 0;
    x.strokeStyle='#8be0d8'; x.lineWidth=1;
    x.beginPath();
    if((spin>>1)&1){  // 머리 위
      x.arc(ax+5, jy-30, 26, Math.PI*1.05, Math.PI*1.95);
    } else {          // 발 아래
      x.arc(ax+5, jy-30, 26, Math.PI*0.05, Math.PI*0.95);
    }
    x.stroke();
    px(ax-5,jy-30,2,3,'#f0c020'); px(ax+14,jy-30,2,3,'#f0c020');  // 손잡이
  }
  else if(pose==='stumble'){
    head(ax+4+wobble, ay-46);
    px(ax+2+wobble,ay-37,12,13,top);
    px(ax-2,ay-36,4,10,skin);
    px(ax+13,ay-38,4,10,skin);
    px(ax+2,ay-24,5,11,pants);
    px(ax+8,ay-24,5,11,pants);
    px(ax+1,ay-3,7,3,shoe); px(ax+9,ay-3,7,3,shoe);
    px(ax+16,ay-50,2,3,'#8be0d8');   // 땀
  }
}

// ---------- 동작 씬 ----------
const AX = 128;
const RIG_Y = 190;
const SCALE = 1.7;    // 동작 잘 보이게 확대

function drawScene(){
  drawGym();
  x.save();
  x.translate(AX, FLOOR); x.scale(SCALE, SCALE); x.translate(-AX, -FLOOR);

  const kg = curWeight();

  if(curMove==='snatch'){
    if(phase==='ready' || phase==='run'){
      drawAthlete(AX, FLOOR, 'setup');
      drawBarbell(AX+13, FLOOR-8, kg);
    } else {
      if(judgment && judgment.pts>0){
        // 풀 → 익스텐션 → 스쿼트 캐치 → 스탠드업, 바가 경로 따라 이동
        if(frame<8){
          drawAthlete(AX, FLOOR, 'pull');
          drawBarbell(AX+8, FLOOR-8-(frame/8)*22, kg);       // 바닥→허벅지
        } else if(frame<16){
          drawAthlete(AX, FLOOR, 'extend');
          drawBarbell(AX+5, FLOOR-30-((frame-8)/8)*34, kg);  // 허벅지→가슴 위
        } else if(frame<28){
          drawAthlete(AX, FLOOR, 'overhead');
          drawBarbell(AX+5, FLOOR-52, kg);                   // 스쿼트 캐치
        } else {
          drawAthlete(AX, FLOOR, 'ohstand');
          drawBarbell(AX+5, FLOOR-62-Math.min(8,(frame-28)), kg);  // 일어서기
        }
      } else {
        drawAthlete(AX, FLOOR, 'stumble');
        drawBarbell(AX+13, FLOOR-8, kg);
      }
    }
  }
  else if(curMove==='bmu'){
    drawRig(AX+5, RIG_Y);
    if(phase==='ready' || phase==='run'){
      // 대기 중에도 살짝 스윙
      const sw = Math.sin(t*0.1)*2;
      drawAthlete(AX+sw, RIG_Y, 'hang');
    } else {
      if(judgment && judgment.pts>0){
        // 킵 → 하이풀 → 트랜지션 → 서포트
        if(frame<10) drawAthlete(AX, RIG_Y, 'kip');
        else if(frame<20) drawAthlete(AX, RIG_Y, 'pullup');
        else if(frame<30) drawAthlete(AX, RIG_Y-2, 'dip');
        else drawAthlete(AX, RIG_Y-2, 'support');
      } else {
        drawAthlete(AX, RIG_Y, 'hang');
        if((frame>>2)&1) text('!', AX+22, RIG_Y+18, 12, '#ff5a5a');
      }
    }
  }
  else { // du
    if(phase==='ready' || phase==='run'){
      // 계속 콩콩 뛰면서 대기
      const jump = Math.abs(Math.sin(t*0.18));
      drawAthlete(AX, FLOOR, 'du', {jump:jump*0.4, spin:t>>2});
    } else {
      if(judgment && judgment.pts>0){
        // 성공: 높은 점프 + 빠른 로프 스핀 (더블!)
        const jp = Math.sin((frame/12)*Math.PI);
        drawAthlete(AX, FLOOR, 'du', {jump:jp, spin:frame});
      } else {
        drawAthlete(AX, FLOOR, 'stumble');   // 줄 걸림
        x.strokeStyle='#8be0d8'; x.lineWidth=1;
        x.beginPath(); x.arc(AX+8, FLOOR-4, 12, 0, Math.PI); x.stroke();
      }
    }
  }

  x.restore();
}

// ---------- 타이밍 게이지 (하단 가로 바) ----------
function drawMeter(p){
  const mx = 20, my = 420, mw = 230, mh = 18;
  px(mx-2, my-2, mw+4, mh+4, '#2a2540');
  px(mx, my, mw, mh, '#14121c');
  const xOf = q => mx + Math.max(0,Math.min(1,q))*mw;
  px(xOf(zone.gLo), my, (zone.gHi-zone.gLo)*mw, mh, '#2e6e5a');
  px(xOf(zone.pLo), my, (zone.pHi-zone.pLo)*mw, mh, '#ffd23f');
  const markX = xOf(p);
  px(markX-2, my-5, 4, mh+10, '#ffffff');
  px(markX-2, my-5, 1, mh+10, '#8be0d8');
  text('TIMING', 135, my-10, 8, '#7a7292');
}

// ---------- 루프 ----------
function loop(){
  t++;
  x.save();
  if(shake>0){ x.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake); shake-=0.5; }

  if(state==='title'){
    drawGym();
    x.save();
    x.translate(AX, FLOOR); x.scale(SCALE, SCALE); x.translate(-AX, -FLOOR);
    drawAthlete(AX, FLOOR, 'ohstand');
    drawBarbell(AX+5, FLOOR-70, 40);
    x.restore();
    x.fillStyle='rgba(0,0,0,0.55)'; x.fillRect(0,60,W,140);
    text('BIRTHDAY', W/2, 100, 26, '#ffd23f');
    text('WOD', W/2, 130, 26, '#ffd23f');
    text('골드 존에서 탭! 퍼펙트를 노려라', W/2, 156, 10, '#f0ead8');
    text('스내치 · 머슬업 · 더블언더', W/2, 172, 10, '#8be0d8');
    if((t>>4)&1) text('▶ 탭해서 시작', W/2, 192, 12, '#8be0d8');
  }

  else if(state==='intro'){
    frame++;
    drawGym();
    const r = WOD[roundIdx];
    x.fillStyle='rgba(0,0,0,0.55)'; x.fillRect(0,140,W,110);
    text('ROUND '+(roundIdx+1), W/2, 168, 13, '#8be0d8');
    text(r.label+(r.weight&&r.move!=='alt'?' '+r.weight+'kg':''), W/2, 194, 15, '#ffd23f');
    text('× '+r.reps, W/2, 214, 12, '#ffd23f');
    if(r.random) text('!! 판정 존이 랩마다 움직임 !!', W/2, 232, 9, '#ff9ec4');
    const cnt = 3 - (frame/30|0);
    if(frame%30===1 && cnt>0) sfx.count();
    if(cnt>0) text(cnt+'', W/2, 246, 11, '#f0ead8');
    if(frame>=90){ sfx.go(); state='play'; startRep(); updateHUD(); }
  }

  else if(state==='play'){
    frame++;
    drawScene();

    if(phase==='ready'){
      if((frame>>3)&1) text('READY...', W/2, 120, 11, '#7a7292');
      if(frame>=readyDur()){ phase='run'; frame=0; }
    }
    else if(phase==='run'){
      const p = frame/repDur;
      drawMeter(p);
      if(p>=1) judge(1.1);
    }
    else if(phase==='result'){
      if(frame>=resultDur()) nextRep();
    }

    if(combo>=2){
      text(combo+' COMBO', W/2, 62, 13, combo>=5?'#ffd23f':'#8be0d8');
    }
  }

  else if(state==='done'){
    drawGym();
    x.save();
    x.translate(AX, FLOOR); x.scale(SCALE, SCALE); x.translate(-AX, -FLOOR);
    drawAthlete(AX, FLOOR, 'ohstand');
    drawBarbell(AX+5, FLOOR-70, 60);
    x.restore();
    x.fillStyle='rgba(0,0,0,0.75)'; x.fillRect(0,52,W,260);

    const total = perfects+goods+misses;
    const rate = total? perfects/total : 0;
    const grade = rate>=0.85 ? "RX'D! 완벽한 애슬릿 ★" : rate>=0.55 ? '좋아! 폼 조금만 더!' : '스케일드... 재도전?';

    text('WOD COMPLETE!', W/2, 88, 18, '#ffd23f');
    text('SCORE  '+score, W/2, 118, 15, '#f0ead8');
    text('PERFECT '+perfects+' · GOOD '+goods, W/2, 144, 10, '#8be0d8');
    text('NO REP '+misses+' · MAX COMBO '+maxCombo, W/2, 160, 10, '#8be0d8');
    text('총 리프팅 '+tonnage+'kg', W/2, 176, 10, '#8be0d8');
    text(grade, W/2, 208, 12, '#ff9ec4');
    text('생일 축하해!', W/2, 238, 15, '#ffd23f');
    if((t>>4)&1) text('▶ 탭해서 다시 도전', W/2, 266, 10, '#7a7292');
    // 하트
    for(let i=0;i<3;i++){
      const hy = 330 - ((t*0.6+i*30)%60);
      const hx = 50 + i*80 + Math.sin(t*0.05+i)*6;
      const a = 1-((t*0.6+i*30)%60)/60;
      x.fillStyle=`rgba(255,158,196,${a})`;
      x.fillRect(hx,hy,2,2); x.fillRect(hx+4,hy,2,2);
      x.fillRect(hx-1,hy+2,8,2); x.fillRect(hx+1,hy+4,4,2); x.fillRect(hx+2,hy+6,2,2);
    }
  }

  // 초크 파티클
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx; p.y+=p.vy; p.vy+=0.06; p.life--;
    if(p.life<=0){ particles.splice(i,1); continue; }
    x.fillStyle=p.col; x.fillRect(p.x|0,p.y|0,2,2);
  }
  // 판정 팝업
  for(let i=popups.length-1;i>=0;i--){
    const p=popups[i];
    p.y-=0.6; p.life--;
    if(p.life<=0){ popups.splice(i,1); continue; }
    text(p.text, W/2, p.y, p.text.length>4?18:14, p.col);
  }

  x.restore();
  requestAnimationFrame(loop);
}

updateHUD();
loop();
</script>
