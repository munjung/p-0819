<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>BIRTHDAY WOD</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Galmuri11:wght@400;700&display=swap');
  * { margin:0; padding:0; box-sizing:border-box;
    -webkit-touch-callout:none; -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color:transparent; }
  body {
    background:#0d0b12;
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; padding:16px;
    font-family:'Galmuri11', monospace; color:#f0ead8;
  }
  #wrap { width:100%; max-width:900px; }
  #hud { display:flex; justify-content:space-between; align-items:flex-end;
    margin-bottom:10px; font-size:13px; letter-spacing:0.5px; }
  #roundLabel { color:#ffd23f; }
  canvas { width:100%; display:block;
    border:3px solid #2e2a3d; border-radius:4px;
    image-rendering:pixelated; background:#14121c; touch-action:none; }
  #hint { margin-top:10px; font-size:11px; color:#7a7292; line-height:1.7; text-align:center; }
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">
    <div id="roundLabel">BIRTHDAY WOD</div>
    <div style="display:flex; gap:14px; align-items:flex-end">
      <div id="mute" style="cursor:pointer; color:#7a7292">♪ ON</div>
      <div id="scoreLabel">SCORE 0</div>
    </div>
  </div>
  <canvas id="c" width="480" height="270"></canvas>
  <div id="hint">게이지가 골드 존에 왔을 때 클릭 / SPACE &nbsp;·&nbsp; M 음소거</div>
</div>

<script>
const c = document.getElementById('c');
const x = c.getContext('2d');
x.imageSmoothingEnabled = false;

const W = 480, H = 270;
const FLOOR = 226;

// ---------- WOD 정의 ----------
const WOD = [
  { move:'snatch', label:'스내치', reps:8,  dur:95 },
  { move:'bmu',    label:'바 머슬업', reps:8,  dur:80 },
  { move:'alt',    label:'스내치 + 머슬업', reps:10, dur:66 },
];
// 판정 존 (게이지 진행도 0~1)
const GOOD_LO = 0.72, GOOD_HI = 0.93;
const PERF_LO = 0.80, PERF_HI = 0.885;

let state = 'title';   // title | intro | play | done
let roundIdx = 0, repIdx = 0;
let phase = 'ready';   // ready | run | result
let frame = 0;
let curMove = 'snatch';
let judgment = null;
let combo = 0, maxCombo = 0, score = 0;
let perfects = 0, goods = 0, misses = 0;
let t = 0, shake = 0;
let particles = [];
let popups = [];

// ---------- 사운드 ----------
let AC = null, muted = false;
function audioInit(){
  if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(_){ return; } }
  if(AC.state==='suspended') AC.resume();
}
function beep(freq, dur, type='square', vol=0.12, slide=0){
  if(!AC || muted) return;
  const o=AC.createOscillator(), g=AC.createGain();
  o.type=type;
  o.frequency.setValueAtTime(freq, AC.currentTime);
  if(slide) o.frequency.linearRampToValueAtTime(Math.max(40,freq+slide), AC.currentTime+dur);
  g.gain.setValueAtTime(vol, AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime+dur);
  o.connect(g); g.connect(AC.destination);
  o.start(); o.stop(AC.currentTime+dur);
}
const sfx = {
  count(){ beep(440, 0.1, 'square', 0.1); },
  go(){ beep(880, 0.22, 'square', 0.12); },
  perfect(){ [784,988,1319].forEach((f,i)=>setTimeout(()=>beep(f,0.1,'square',0.11), i*55)); },
  good(){ beep(660, 0.1, 'square', 0.1); },
  norep(){ beep(150, 0.3, 'sawtooth', 0.15, -80); },
  clear(){ [523,659,784,1047,1319].forEach((f,i)=>setTimeout(()=>beep(f,0.15,'square',0.1), i*120)); },
};
const muteEl = document.getElementById('mute');
function toggleMute(){ muted=!muted; muteEl.textContent = muted?'♪ OFF':'♪ ON'; }
muteEl.addEventListener('pointerdown', e=>{ e.preventDefault(); audioInit(); toggleMute(); });

// ---------- 입력 ----------
function action(){
  audioInit();
  if(state==='title'){ startWOD(); return; }
  if(state==='done'){ if(t>60){ state='title'; t=0; updateHUD(); } return; }
  if(state==='play' && phase==='run') judge(frame / curDur());
}
addEventListener('keydown', e=>{
  if(e.code==='Space'||e.code==='ArrowUp'){ e.preventDefault(); if(!e.repeat) action(); }
  if(e.code==='KeyM'){ audioInit(); toggleMute(); }
});
c.addEventListener('pointerdown', e=>{ e.preventDefault(); action(); });
['contextmenu','selectstart','dragstart'].forEach(ev=>document.addEventListener(ev, e=>e.preventDefault()));
document.addEventListener('gesturestart', e=>e.preventDefault());

// ---------- 진행 ----------
function curDur(){
  // 라운드 기본 속도 + 랩이 진행될수록 살짝 빨라짐
  return Math.max(40, WOD[roundIdx].dur - repIdx*2);
}
function pickMove(){
  const m = WOD[roundIdx].move;
  curMove = (m==='alt') ? (repIdx%2===0 ? 'snatch' : 'bmu') : m;
}
function startWOD(){
  state='intro'; roundIdx=0; repIdx=0; frame=0; t=0;
  combo=0; maxCombo=0; score=0; perfects=0; goods=0; misses=0;
  particles=[]; popups=[];
  updateHUD();
}
function startRep(){
  phase='ready'; frame=0; judgment=null; pickMove();
}
function judge(p){
  let res;
  if(p>=PERF_LO && p<=PERF_HI){
    combo++; perfects++;
    const pts = 100 + combo*10;
    score += pts;
    res = {text:'PERFECT!', col:'#ffd23f', pts};
    sfx.perfect(); shake=5;
    chalk(20);
  } else if(p>=GOOD_LO && p<=GOOD_HI){
    combo++; goods++;
    const pts = 50 + combo*5;
    score += pts;
    res = {text:'GOOD', col:'#8be0d8', pts};
    sfx.good(); chalk(8);
  } else {
    combo=0; misses++;
    res = {text:p<GOOD_LO?'EARLY!':'NO REP!', col:'#ff5a5a', pts:0};
    sfx.norep(); shake=7;
  }
  maxCombo = Math.max(maxCombo, combo);
  judgment = res;
  popups.push({text:res.text, col:res.col, y:100, life:40});
  if(res.pts) popups.push({text:'+'+res.pts, col:'#f0ead8', y:118, life:40});
  phase='result'; frame=0;
  updateHUD();
}
function nextRep(){
  repIdx++;
  if(repIdx >= WOD[roundIdx].reps){
    roundIdx++;
    repIdx=0;
    if(roundIdx >= WOD.length){ state='done'; t=0; sfx.clear(); return; }
    state='intro'; frame=0;
    updateHUD();
  } else { startRep(); updateHUD(); }
}
function updateHUD(){
  document.getElementById('roundLabel').textContent =
    (state==='play'||state==='intro')
      ? `ROUND ${roundIdx+1}/${WOD.length} — ${WOD[roundIdx].label} ${repIdx+1}/${WOD[roundIdx].reps}`
      : 'BIRTHDAY WOD';
  document.getElementById('scoreLabel').textContent = 'SCORE '+score;
}
function chalk(n){
  for(let i=0;i<n;i++) particles.push({
    x:200+Math.random()*30-15, y:FLOOR-70-Math.random()*40,
    vx:(Math.random()-.5)*3, vy:-Math.random()*2.5,
    life:20+Math.random()*20, col:'#ffffffcc'
  });
}

// ---------- 픽셀 헬퍼 ----------
function px(a,b,w,h,col){ x.fillStyle=col; x.fillRect(a|0,b|0,w,h); }
function text(str,cx,cy,size,col,align='center'){
  x.font=size+'px Galmuri11, monospace'; x.textAlign=align; x.fillStyle=col; x.fillText(str,cx,cy);
}

// ---------- 배경: 체육관 ----------
function drawGym(){
  px(0,0,W,H,'#14121c');
  for(let i=0;i<6;i++) px(i*80,0,1,FLOOR,'#1c1928');
  // 생일 배너
  px(90,22,300,26,'#2a2340');
  px(90,22,300,3,'#3d3355');
  text('★ HAPPY BIRTHDAY WOD ★', 240, 40, 13, '#ffd23f');
  // 플레이트 랙
  px(10,FLOOR-46,10,46,'#c94f5a'); px(22,FLOOR-40,8,40,'#4f7cc9'); px(32,FLOOR-32,7,32,'#f0c020');
  // 케틀벨
  px(438,FLOOR-16,16,16,'#3a3648'); px(442,FLOOR-22,8,8,'#3a3648'); px(444,FLOOR-20,4,4,'#14121c');
  // 러버 매트 바닥
  px(0,FLOOR,W,H-FLOOR,'#221e30');
  for(let i=0;i<8;i++) px(i*60,FLOOR,1,H-FLOOR,'#2a2540');
  px(0,FLOOR,W,2,'#332e48');
  // 조명
  for(let i=0;i<3;i++){
    px(70+i*160,0,40,6,'#3a3648');
    x.fillStyle='rgba(255,240,200,0.03)';
    x.beginPath(); x.moveTo(70+i*160,6); x.lineTo(50+i*160,FLOOR); x.lineTo(130+i*160,FLOOR); x.lineTo(110+i*160,6); x.fill();
  }
}

// ---------- 바벨 ----------
function drawBarbell(bx, by){
  px(bx-38,by-10,10,20,'#c94f5a'); px(bx-36,by-6,6,12,'#a83a45');
  px(bx+28,by-10,10,20,'#c94f5a'); px(bx+30,by-6,6,12,'#a83a45');
  px(bx-28,by-2,56,4,'#b8bcc8');
  px(bx-28,by-2,56,1,'#e0e4ec');
}

// ---------- 풀업 리그 ----------
function drawRig(rx, barY){
  px(rx-52,barY,104,4,'#8a8fa0');
  px(rx-52,barY,104,1,'#c8ccd8');
  px(rx-56,barY-30,6,FLOOR-(barY-30),'#2e2a3d');
  px(rx+50,barY-30,6,FLOOR-(barY-30),'#2e2a3d');
  px(rx-56,barY-30,6,3,'#3d3860'); px(rx+50,barY-30,6,3,'#3d3860');
}

// ---------- 애슬릿 (포니테일) ----------
// pose: setup | pull | overhead | hang | pullup | support | stumble
function drawAthlete(ax, ay, pose){
  const skin='#f2cba6', hair='#3a2820', top='#d94f7a', topD='#b83a60',
        pants='#2e2a3d', shoe='#f0f0f0';
  const wobble = (pose==='stumble') ? Math.sin(t*0.6)*2 : 0;

  function head(hx,hy,tailDir){
    px(hx,hy,10,9,skin);
    px(hx,hy-2,10,4,hair); px(hx-1,hy-1,3,5,hair);
    // 포니테일
    px(hx+8+tailDir*2, hy-1, 4, 3, hair);
    px(hx+10+tailDir*3, hy+1, 3, 6, hair);
    px(hx+2,hy+3,2,2,'#1a1a1a'); px(hx+6,hy+3,2,2,'#1a1a1a');
    px(hx+3,hy+7,4,1,'#c8836a');
  }

  if(pose==='setup'){
    // 데드리프트 셋업: 상체 숙이고 바 그립
    head(ax+8, ay-34, -1);
    px(ax-2,ay-27,16,10,top);
    px(ax-2,ay-27,16,2,topD);
    px(ax+10,ay-24,4,14,skin);
    px(ax+16,ay-24,4,14,skin);
    px(ax-2,ay-18,8,10,pants);
    px(ax,ay-8,7,8,pants);
    px(ax-1,ay-3,9,3,shoe);
    px(ax+8,ay-3,9,3,shoe);
  }
  else if(pose==='pull'){
    // 세컨드 풀: 직립 + 바 가슴 높이
    head(ax, ay-52, 1);
    px(ax-1,ay-43,12,14,top);
    px(ax-1,ay-43,12,2,topD);
    px(ax-4,ay-42,4,10,skin);
    px(ax+9,ay-42,4,10,skin);
    px(ax,ay-29,5,14,pants);
    px(ax+6,ay-29,5,14,pants);
    px(ax-1,ay-3,7,3,shoe); px(ax+6,ay-3,7,3,shoe);
  }
  else if(pose==='overhead'){
    // 오버헤드 캐치
    head(ax, ay-48, 1);
    px(ax-1,ay-39,12,12,top);
    px(ax-1,ay-39,12,2,topD);
    px(ax-4,ay-52,4,14,skin);
    px(ax+9,ay-52,4,14,skin);
    px(ax-2,ay-27,7,9,pants);
    px(ax+7,ay-27,7,9,pants);
    px(ax-3,ay-18,7,15,pants);
    px(ax+8,ay-18,7,15,pants);
    px(ax-4,ay-3,8,3,shoe); px(ax+8,ay-3,8,3,shoe);
  }
  else if(pose==='hang'){
    // 풀업바 매달림 (ay = 바 y)
    px(ax-3,ay+2,3,14,skin);
    px(ax+9,ay+2,3,14,skin);
    head(ax-1, ay+14, 1);
    px(ax-1,ay+23,11,13,top);
    px(ax-1,ay+23,11,2,topD);
    px(ax,ay+36+wobble,4,12,pants);
    px(ax+5,ay+36-wobble,4,12,pants);
    px(ax-1,ay+48,6,3,shoe); px(ax+5,ay+48,6,3,shoe);
  }
  else if(pose==='pullup'){
    // 치닝: 턱이 바 위
    head(ax-1, ay-10, 1);
    px(ax-4,ay-1,4,8,skin);
    px(ax+9,ay-1,4,8,skin);
    px(ax-1,ay-1,11,12,top);
    px(ax,ay+11,4,10,pants);
    px(ax+5,ay+11,4,10,pants);
    px(ax-1,ay+21,6,3,shoe); px(ax+5,ay+21,6,3,shoe);
  }
  else if(pose==='support'){
    // 바 위 서포트
    head(ax-1, ay-32, 1);
    px(ax-1,ay-23,11,13,top);
    px(ax-1,ay-23,11,2,topD);
    px(ax-5,ay-22,4,12,skin);
    px(ax+10,ay-22,4,12,skin);
    px(ax,ay-10,4,10,pants);
    px(ax+5,ay-10,4,10,pants);
    px(ax-1,ay,6,3,shoe); px(ax+5,ay,6,3,shoe);
  }
  else if(pose==='stumble'){
    // 실패: 휘청
    head(ax+4+wobble, ay-46, -1);
    px(ax+2+wobble,ay-37,12,13,top);
    px(ax-2,ay-36,4,10,skin);
    px(ax+13,ay-38,4,10,skin);
    px(ax+2,ay-24,5,11,pants);
    px(ax+8,ay-24,5,11,pants);
    px(ax+1,ay-3,7,3,shoe); px(ax+9,ay-3,7,3,shoe);
    // 땀
    px(ax+16,ay-50,2,3,'#8be0d8');
  }
}

// ---------- 동작 씬 ----------
const AX = 200;           // 애슬릿 x
const RIG_Y = 90;         // 풀업바 y
function drawScene(){
  drawGym();

  if(curMove==='snatch'){
    if(phase==='ready' || phase==='run'){
      drawAthlete(AX, FLOOR, 'setup');
      drawBarbell(AX+13, FLOOR-8);
    } else {
      if(judgment && judgment.pts>0){
        if(frame<10){ drawAthlete(AX, FLOOR, 'pull'); drawBarbell(AX+5, FLOOR-38); }
        else { drawAthlete(AX, FLOOR, 'overhead'); drawBarbell(AX+5, FLOOR-58); }
      } else {
        drawAthlete(AX, FLOOR, 'stumble');
        drawBarbell(AX+13, FLOOR-8);
      }
    }
  } else { // bmu
    drawRig(AX+5, RIG_Y);
    if(phase==='ready' || phase==='run'){
      drawAthlete(AX, RIG_Y, 'hang');
    } else {
      if(judgment && judgment.pts>0){
        if(frame<10) drawAthlete(AX, RIG_Y, 'pullup');
        else drawAthlete(AX, RIG_Y-2, 'support');
      } else {
        drawAthlete(AX, RIG_Y, 'hang');
        if((frame>>2)&1) text('!', AX+22, RIG_Y+18, 14, '#ff5a5a');
      }
    }
  }
}

// ---------- 타이밍 게이지 ----------
function drawMeter(p){
  const mx = 420, my = 40, mh = 170;
  px(mx-2, my-2, 18, mh+4, '#2a2540');
  px(mx, my, 14, mh, '#14121c');
  // 존 (아래→위 진행)
  const yOf = q => my + mh - q*mh;
  px(mx, yOf(GOOD_HI), 14, (GOOD_HI-GOOD_LO)*mh, '#2e6e5a');
  px(mx, yOf(PERF_HI), 14, (PERF_HI-PERF_LO)*mh, '#ffd23f');
  // 마커
  const markY = yOf(Math.min(1,p));
  px(mx-5, markY-2, 24, 4, '#ffffff');
  px(mx-5, markY-2, 24, 1, '#8be0d8');
  text('TIMING', mx+7, my-10, 8, '#7a7292');
}

// ---------- 루프 ----------
function loop(){
  t++;
  x.save();
  if(shake>0){ x.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake); shake-=0.5; }

  if(state==='title'){
    drawGym();
    drawAthlete(140, FLOOR, 'overhead');
    drawBarbell(145, FLOOR-58);
    drawRig(320, RIG_Y);
    drawAthlete(315, RIG_Y-2, 'support');
    x.fillStyle='rgba(0,0,0,0.55)'; x.fillRect(0,52,W,110);
    text('BIRTHDAY WOD', W/2, 92, 26, '#ffd23f');
    text('골드 존에서 클릭! 퍼펙트 판정을 노려라', W/2, 118, 11, '#f0ead8');
    text('스내치 8 · 바 머슬업 8 · 콤보 라운드 10', W/2, 136, 10, '#8be0d8');
    if((t>>4)&1) text('▶ 클릭 또는 SPACE', W/2, 156, 12, '#8be0d8');
  }

  else if(state==='intro'){
    frame++;
    drawGym();
    const r = WOD[roundIdx];
    x.fillStyle='rgba(0,0,0,0.55)'; x.fillRect(0,80,W,80);
    text('ROUND '+(roundIdx+1), W/2, 108, 14, '#8be0d8');
    text(r.label+' × '+r.reps, W/2, 134, 20, '#ffd23f');
    const cnt = 3 - (frame/30|0);
    if(frame%30===1 && cnt>0) sfx.count();
    if(cnt>0) text(cnt+'', W/2, 154, 12, '#f0ead8');
    if(frame>=90){ sfx.go(); state='play'; startRep(); updateHUD(); }
  }

  else if(state==='play'){
    frame++;
    drawScene();

    if(phase==='ready'){
      if((frame>>3)&1) text('READY...', AX+8, FLOOR-100, 11, '#7a7292');
      if(frame>=32){ phase='run'; frame=0; }
    }
    else if(phase==='run'){
      const p = frame/curDur();
      drawMeter(p);
      if(p>=1) judge(1.1);  // 안 눌렀으면 NO REP
    }
    else if(phase==='result'){
      if(frame>=42) nextRep();
    }

    if(combo>=2){
      text(combo+' COMBO', 60, 70, 13, combo>=5?'#ffd23f':'#8be0d8');
    }
  }

  else if(state==='done'){
    drawGym();
    drawAthlete(140, FLOOR, 'overhead'); drawBarbell(145, FLOOR-58);
    drawRig(330, RIG_Y); drawAthlete(325, RIG_Y-2, 'support');
    x.fillStyle='rgba(0,0,0,0.72)'; x.fillRect(0,34,W,196);

    const total = perfects+goods+misses;
    const rate = total? perfects/total : 0;
    const grade = rate>=0.85 ? "RX'D! 완벽한 애슬릿 ★" : rate>=0.55 ? '좋아! 폼 조금만 더!' : '스케일드... 재도전?';

    text('WOD COMPLETE!', W/2, 66, 22, '#ffd23f');
    text('SCORE  '+score, W/2, 96, 16, '#f0ead8');
    text('PERFECT '+perfects+'  ·  GOOD '+goods+'  ·  NO REP '+misses, W/2, 120, 11, '#8be0d8');
    text('MAX COMBO '+maxCombo, W/2, 138, 11, '#8be0d8');
    text(grade, W/2, 166, 14, '#ff9ec4');
    text('생일 축하해!', W/2, 192, 15, '#ffd23f');
    if((t>>4)&1) text('▶ 클릭해서 다시 도전', W/2, 214, 10, '#7a7292');
    // 하트
    for(let i=0;i<3;i++){
      const hy = 230 - ((t*0.6+i*30)%60);
      const hx = 90 + i*150 + Math.sin(t*0.05+i)*6;
      const a = 1-((t*0.6+i*30)%60)/60;
      x.fillStyle=`rgba(255,158,196,${a})`;
      x.fillRect(hx,hy,2,2); x.fillRect(hx+4,hy,2,2);
      x.fillRect(hx-1,hy+2,8,2); x.fillRect(hx+1,hy+4,4,2); x.fillRect(hx+2,hy+6,2,2);
    }
  }

  // 초크 파티클
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx; p.y+=p.vy; p.vy+=0.06; p.life--;
    if(p.life<=0){ particles.splice(i,1); continue; }
    x.fillStyle=p.col; x.fillRect(p.x|0,p.y|0,2,2);
  }
  // 판정 팝업
  for(let i=popups.length-1;i>=0;i--){
    const p=popups[i];
    p.y-=0.6; p.life--;
    if(p.life<=0){ popups.splice(i,1); continue; }
    text(p.text, AX+8, p.y, p.text.length>4?16:13, p.col);
  }

  x.restore();
  requestAnimationFrame(loop);
}

updateHUD();
loop();
</script>
</body>
</html>
